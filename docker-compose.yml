services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dental
      MYSQL_DATABASE: dental_clinic
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdental"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: dev-secret-change-me
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: dental
      MYSQL_DATABASE: dental_clinic
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
