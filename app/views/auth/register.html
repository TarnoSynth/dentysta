{% extends "layout.html" %}
{% block title %}Rejestracja{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Konto pacjenta</h1>
    {% include "partials/errors.html" %}
    <form method="post" class="stack">
      {% include "partials/csrf.html" %}
      <div class="split">
        <div>
          <label for="first_name">Imię</label>
          <input id="first_name" name="first_name" value="{{ form.first_name }}" required>
        </div>
        <div>
          <label for="last_name">Nazwisko</label>
          <input id="last_name" name="last_name" value="{{ form.last_name }}" required>
        </div>
      </div>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="{{ form.email }}" required autocomplete="username">
      <label for="phone">Telefon <span class="optional">opcjonalnie</span></label>
      <input id="phone" name="phone" value="{{ form.phone }}" autocomplete="tel">
      <label for="password">Hasło</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8">
      <label for="password_confirm">Powtórz hasło</label>
      <input id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password" minlength="8">
      <button type="submit">Utwórz konto</button>
    </form>
  </section>
{% endblock %}
