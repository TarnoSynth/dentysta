{% extends "layout.html" %}
{% block title %}Nowa wizyta{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Umów wizytę</h1>
    {% include "partials/errors.html" %}
    <form method="post" action="{{ url_for('appointments.create') }}" class="stack" data-booking>
      {% include "partials/csrf.html" %}
      <label for="treatment_id">Zabieg</label>
      <select id="treatment_id" name="treatment_id" required>
        <option value="">Wybierz zabieg</option>
        {% for treatment in treatments %}
          <option value="{{ treatment.id }}" {% if treatment.id|string == selected.treatment_id|string %}selected{% endif %}>
            {{ treatment.name }} · {{ treatment.duration_minutes }} min
          </option>
        {% endfor %}
      </select>
      <label for="dentist_id">Dentysta</label>
      <select id="dentist_id" name="dentist_id" required>
        <option value="">Wybierz dentystę</option>
        {% for dentist in dentists %}
          <option value="{{ dentist.id }}" {% if dentist.id|string == selected.dentist_id|string %}selected{% endif %}>{{ dentist.full_name }}</option>
        {% endfor %}
      </select>
      <label for="visit_date">Data</label>
      <input id="visit_date" name="visit_date" type="date" min="{{ today }}" value="{{ selected.visit_date }}" required>
      <label for="start_time">Godzina</label>
      <select id="start_time" name="start_time" required>
        <option value="">Wybierz godzinę</option>
        {% for slot in slots %}
          {% set label = slot.start.strftime('%H:%M') %}
          <option value="{{ label }}" {% if label == selected.start_time %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
      <p class="hint" data-slot-hint></p>
      <button type="submit">Zarezerwuj</button>
    </form>
  </section>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/booking.js') }}"></script>
{% endblock %}
