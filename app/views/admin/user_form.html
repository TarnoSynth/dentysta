{% extends "layout.html" %}
{% block title %}Edycja konta{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>{{ user.full_name }}</h1>
    {% include "partials/errors.html" %}
    <form method="post" class="stack">
      {% include "partials/csrf.html" %}
      <div class="split">
        <div>
          <label for="first_name">Imię</label>
          <input id="first_name" name="first_name" value="{{ form.first_name }}" required maxlength="100">
        </div>
        <div>
          <label for="last_name">Nazwisko</label>
          <input id="last_name" name="last_name" value="{{ form.last_name }}" required maxlength="100">
        </div>
      </div>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="{{ form.email }}" required>
      <label for="phone">Telefon <span class="optional">opcjonalnie</span></label>
      <input id="phone" name="phone" value="{{ form.phone }}">
      <div class="actions">
        <button type="submit">Zapisz dane</button>
        <a class="button button-ghost" href="{{ url_for('users.admin_list') }}">Wróć</a>
      </div>
    </form>
  </section>
{% endblock %}
